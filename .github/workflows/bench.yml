# 对照压测：http / tcp / udp 三种模式，双方代理方式一致；每档先预热再测
# 手动触发默认 all（三模式全跑）；定时触发每周自动跑一遍，兜底值同为 all
name: bench

on:
  # 每周日 03:00 UTC（北京时间周一 11:00）自动跑三模式对照。
  # schedule 触发时 inputs 为空，下面所有 || 'all' 兜底保证 UDP 也会跑。
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      ft_release:
        description: 'FastTunnel Release tag（用官方发布包测试）'
        default: 'v3.4.0'
      mode:
        description: '跑哪些模式（all=三种都跑，默认 / http / tcp / udp / both=仅 http+tcp）'
        default: 'all'
      levels:
        description: 'HTTP/TCP 的 RPS 阶梯'
        default: '5000,10000,20000,30000,40000,50000'
      udp_levels:
        description: 'UDP 的 PPS 阶梯（UDP 与 HTTP/TCP 独立，避免高档位压不满）'
        default: '1000,3000,5000,10000,20000,30000,40000,50000'
      connections:
        description: '并发连接数（auto-connections=0 时才固定生效）'
        default: '128'
      auto_connections:
        description: '并发随档位放大（1=开，0=固定用上面的并发数）'
        default: '1'
      rounds:
        description: '轮数（奇偶轮交换两侧先后，取中位数）'
        default: '3'
      frp_pool:
        description: 'frp 双侧连接池：0=出厂默认（poolCount 1 / maxPoolCount 5，推荐）；auto=调平到本轮最大并发（实测对 frp type=http 是反向的，只做显式实验）'
        default: '0'
      duration:
        description: '每档测量秒数'
        default: '10'
      prewarm:
        description: '每侧预热秒数'
        default: '10'
  push:
    paths:
      - '.github/workflows/bench.yml'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装绘图依赖与中文字体
        run: |
          python3 -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-list | grep -i noto | head -n 3

      - name: 环境与脚本检查
        run: |
          echo "cores=$(nproc)  mem=$(awk '/MemTotal/{printf "%.1f", $2/1048576}' /proc/meminfo) GB  $(uname -srm)"
          dotnet --version
          bash -n bench/exp/bench.sh && echo "bench.sh 语法通过"

      - name: HTTP 对照（FastTunnel Web vs frp type=http）
        if: ${{ contains(fromJSON('["http","both","all"]'), github.event.inputs.mode || 'all') }}
        run: |
          bash bench/exp/bench.sh http \
            --levels "${{ github.event.inputs.levels || '5000,10000,20000,30000,40000,50000' }}" \
            --connections "${{ github.event.inputs.connections || '128' }}" \
            --auto-connections "${{ github.event.inputs.auto_connections || '1' }}" \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            --frp-pool "${{ github.event.inputs.frp_pool || '0' }}" \
            --duration "${{ github.event.inputs.duration || '10' }}" \
            --prewarm "${{ github.event.inputs.prewarm || '10' }}" \
            --ft-release "${{ github.event.inputs.ft_release || 'v3.4.0' }}"

      - name: TCP 对照（FastTunnel Forwards vs frp type=tcp）
        if: ${{ contains(fromJSON('["tcp","both","all"]'), github.event.inputs.mode || 'all') }}
        continue-on-error: true
        run: |
          bash bench/exp/bench.sh tcp \
            --levels "${{ github.event.inputs.levels || '5000,10000,20000,30000,40000,50000' }}" \
            --connections "${{ github.event.inputs.connections || '128' }}" \
            --auto-connections "${{ github.event.inputs.auto_connections || '1' }}" \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            --frp-pool "${{ github.event.inputs.frp_pool || '0' }}" \
            --duration "${{ github.event.inputs.duration || '10' }}" \
            --prewarm "${{ github.event.inputs.prewarm || '10' }}" \
            --ft-release "${{ github.event.inputs.ft_release || 'v3.4.0' }}"

      - name: UDP 对照（FastTunnel Forwards UDP vs frp type=udp）
        if: ${{ contains(fromJSON('["udp","all"]'), github.event.inputs.mode || 'all') }}
        continue-on-error: true
        run: |
          bash bench/exp/bench.sh udp \
            --levels "${{ github.event.inputs.udp_levels || '1000,3000,5000,10000,20000,30000,40000,50000' }}" \
            --connections "${{ github.event.inputs.connections || '128' }}" \
            --auto-connections "${{ github.event.inputs.auto_connections || '1' }}" \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            --frp-pool "${{ github.event.inputs.frp_pool || '0' }}" \
            --duration "${{ github.event.inputs.duration || '10' }}" \
            --prewarm "${{ github.event.inputs.prewarm || '10' }}" \
            --ft-release "${{ github.event.inputs.ft_release || 'v3.4.0' }}"

      - name: 生成图表并提交
        if: always()
        env:
          LEVELS_INPUT: ${{ github.event.inputs.levels || '5000,10000,20000,30000,40000,50000' }}
          UDP_LEVELS_INPUT: ${{ github.event.inputs.udp_levels || '1000,3000,5000,10000,20000,30000,40000,50000' }}
        run: |
          mkdir -p results/latest
          shopt -s nullglob
          # 每次运行都是全新 checkout，out/exp 里只会有多跑过的模式留下的 CSV；
          # 这里统一遍历三种，-f 守卫跳过没跑的模式。
          for mode in http tcp udp; do
            csv="out/exp/results-${mode}.csv"
            if [ -f "$csv" ]; then
              if [ "$mode" = "udp" ]; then levels="$UDP_LEVELS_INPUT"; else levels="$LEVELS_INPUT"; fi
              python3 bench/exp/chart.py --csv "$csv" --out "results/latest/chart-${mode}.png" --mode "$mode" --levels "$levels"
              cp "$csv" "results/latest/results-${mode}.csv"
            fi
          done
          if [ -n "$(git status --porcelain results/latest)" ]; then
            git config user.name "bench-bot"
            git config user.email "bench-bot@users.noreply.github.com"
            git add results/latest
            git commit -q -m "chore(bench): charts for run #${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "没有可提交的图表"
          fi

      - name: 生成 Issue 正文
        if: always()
        run: |
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME"
          {
            echo "**Runner**：$(nproc) 核 / $(awk '/MemTotal/{printf "%.1f", $2/1048576}' /proc/meminfo) GB / $(uname -srm)"
            echo "**参数**：mode=${{ github.event.inputs.mode || 'all' }}，levels=${{ github.event.inputs.levels || '5000,10000,20000,30000,40000,50000' }}，udp_levels=${{ github.event.inputs.udp_levels || '1000,3000,5000,10000,20000,30000,40000,50000' }}，connections=${{ github.event.inputs.connections || '128' }}，auto_connections=${{ github.event.inputs.auto_connections || '1' }}，rounds=${{ github.event.inputs.rounds || '3' }}，frp_pool=${{ github.event.inputs.frp_pool || '0' }}，duration=${{ github.event.inputs.duration || '10' }}s，prewarm=${{ github.event.inputs.prewarm || '10' }}s"
            echo "**运行**：[#${{ github.run_number }}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "> 两侧同一种代理方式（http 对 http、tcp 对 tcp），健康检查通过后先预热再测量。"
            echo "> runner 为共享 vCPU，绝对数值仅作趋势参考。"
            echo "> **成功 RPS** 只数 200 响应，跨框架对比看这一列；**落后** 不为 0 时对照成功 RPS：达标只是发送被排后（吞吐可引用、p99 偏乐观），没达标就是没压上去（该档不能引用）。"
            echo "> frp 连接池：\`0\`=出厂默认（frpc poolCount=1 / frps maxPoolCount=5，本轮默认）；\`auto\`/数字=双侧一起调平，实测会让 frp 的 http 模式更差，只在显式要求时启用。"
            echo
            for mode in http tcp udp; do
              chart="results/latest/chart-${mode}.png"
              report="out/exp/report-${mode}.md"
              [ -f "$report" ] || continue
              echo "## ${mode} 模式"
              echo
              if [ -f "$chart" ]; then
                echo "![${mode}](${raw}/${chart}?v=${{ github.run_number }})"
                echo
              fi
              echo "<details><summary>展开明细（数据表 / 原始 CSV）</summary>"
              echo
              cat "$report"
              echo
              if [ -f "out/exp/results-${mode}.csv" ]; then
                echo '```'
                cat "out/exp/results-${mode}.csv"
                echo '```'
              fi
              echo
              echo "</details>"
              echo
            done
            # 失败时把隧道日志贴进 issue，方便在无 admin 权限时排障。
            # 注意：mode 可只跑一种，所以只在新模式下「一个报告都没生成」时才算失败，
            # 不能用 ls a b c（那会要求三种都存在）。
            report_count=$(ls out/exp/report-http.md out/exp/report-tcp.md out/exp/report-udp.md 2>/dev/null | wc -l)
            if [ "$report_count" -eq 0 ]; then
              echo "## 排障信息（失败）"
              echo
              echo '```'
              ss -ltnp 2>/dev/null | head -n 20
              echo '```'
              for log in out/exp/run/*.log; do
                [ -s "$log" ] || continue
                echo "<details><summary>$(basename "$log")</summary>"
                echo
                echo '```'
                tail -n 30 "$log"
                echo '```'
                echo
                echo "</details>"
              done
            fi
          } > issue-body.md
          head -n 40 issue-body.md

      # 每次运行都新建一条 issue，方便按时间线对比历史；不再往旧 issue 里追加评论
      - name: 创建报告 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE_INPUT: ${{ github.event.inputs.mode || 'all' }}
          LEVELS_INPUT: ${{ github.event.inputs.levels || '5000,10000,20000,30000,40000,50000' }}
        run: |
          gh label create bench-report --color 0E8A16 --description '自动压测报告' 2>/dev/null || true
          title="[bench] $(date -u '+%Y-%m-%d %H:%M') UTC · run #${{ github.run_number }} · ${MODE_INPUT} · ${LEVELS_INPUT}"
          url=$(gh issue create --title "$title" --body-file issue-body.md --label bench-report)
          echo "已创建：$url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传原始数据与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            out/exp/report-http.md
            out/exp/report-tcp.md
            out/exp/report-udp.md
            out/exp/results-http.csv
            out/exp/results-tcp.csv
            out/exp/results-udp.csv
            out/exp/results/*.json
            out/exp/run/*.log
            issue-body.md
